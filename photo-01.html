/* 写真一覧 */

.photo {

  border-radius: 14px;

.photo:active {

.photo img {

.caption {

/* 拡大表示画面 */

  justify-content: center;

}

.viewer.open {

}

.viewer img {

  border-radius: 8px;

.viewer-caption {

}

.close {

  right: 16px;
  width: 42px;
  height: 42px;
  border: 2px solid #dfd0f5;
  border-radius: 50%;
  background: #fff;
  color: #665078;
  font-size: 26px;

}

.back {

  background: #fff;

.back + .back {

<!-- 拡大表示 -->
<div class="viewer" id="viewer">
  <button class="close" id="closeViewer" aria-label="閉じる">×</button>
  <img id="largeImage" src="" alt="">
  <div class="viewer-caption" id="largeCaption"></div>
</div>

<script>
(function () {
  const viewer = document.getElementById("viewer");
  const largeImage = document.getElementById("largeImage");
  const largeCaption = document.getElementById("largeCaption");
  const closeViewer = document.getElementById("closeViewer");

  if (!viewer || !largeImage || !largeCaption || !closeViewer) {
    return;
  }

  document.querySelectorAll(".photo").forEach(function (card) {
    card.addEventListener("click", function () {
      const image = card.querySelector("img");

      if (!image || !image.complete || image.naturalWidth === 0) {
        return;
      }

      largeImage.src = image.src;
      largeImage.alt = image.alt || "";
      largeCaption.textContent = card.dataset.caption || "";

      viewer.classList.add("open");
      document.body.style.overflow = "hidden";
    });
  });

  function closeImage() {
    viewer.classList.remove("open");
    largeImage.removeAttribute("src");
    document.body.style.overflow = "";
  }

  closeViewer.addEventListener("click", closeImage);

  viewer.addEventListener("click", function (event) {
    if (event.target === viewer) {
      closeImage();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeImage();
    }
  });
})();
</script>
