<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大好きボタン | rmsm</title>
<style>
body {
  margin: 0;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background-color: #eee5ff;
  background-image:
    linear-gradient(rgba(203, 180, 235, 0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(203, 180, 235, 0.35) 1px, transparent 1px);
  background-size: 24px 24px;
}
.container {
  width: 88%;
  max-width: 600px;
  margin: 30px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 30px 20px;
  background: #dfd0f5;
  border-radius: 20px;
  border: 3px dotted #b99bdd;
  box-sizing: border-box;
}
header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: bold;
  color: #665078;
}
/* 説明 */
.content {
  margin-top: 22px;
  padding: 25px;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 16px;
  text-align: center;
  line-height: 1.9;
  box-sizing: border-box;
}
/* ボタン */
.like-area {
  margin-top: 25px;
  text-align: center;
}
.like-button {
  padding: 15px 30px;
  border: 2px solid #b99bdd;
  border-radius: 12px;
  background: #dfd0f5;
  color: #5b506b;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.like-button:hover {
  background: #d4c0ee;
}
.message {
  margin-top: 20px;
  min-height: 30px;
  line-height: 1.7;
}
.count {
  margin-top: 15px;
  font-size: 14px;
  color: #7b6b89;
}
/* 戻るボタン */
.back {
  display: block;
  margin-top: 25px;
  padding: 15px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>大好きボタン</h1>
</header>
<div class="content">
  <p>
    れめさめが好きな方へ。<br>
    「れめさめ大好き！」と思った時に押すボタンです。
  </p>
</div>
<div class="like-area">
  <button class="like-button" id="btn">
    れめさめ大好き！
  </button>
  <div class="message" id="msg"></div>
  <div class="count" id="count">
    読み込み中...
  </div>
</div>

トップへ戻る

</div>
<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAFkIeLQkAhdyAvEE2ADHJQFotz8aDVejI",
  authDomain: "doushi-button.firebaseapp.com",
  projectId: "doushi-button",
  storageBucket: "doushi-button.firebasestorage.app",
  messagingSenderId: "221646366483",
  appId: "1:221646366483:web:fa7fd666f7f7c4cb15dce6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "doushi", "counter");
const messages = [
  "❤️ 私も！！！！！！！！！！！",
  "🩷 れめさめって、良いですよね……。",
  "💙 ずっと一緒に大好きでいましょう。"
];
async function init() {
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { count: 0 });
  }
  await load();
}
async function load() {
  const snap = await getDoc(ref);
  const data = snap.data();
  document.getElementById("count").innerText =
    `現在 ${data.count} 回れめさめが愛されました`;
}
document.getElementById("btn").addEventListener("click", async () => {
  await updateDoc(ref, {
    count: increment(1)
  });
  const randomMessage =
    messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("msg").innerText =
    randomMessage;
  await load();
});
init();
</script>
</body>
</html>
