<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大好きボタン | rmsm</title>
<style>
body {
  margin: 0;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background-color: #eee5ff;
  background-image:
    linear-gradient(rgba(203, 180, 235, 0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(203, 180, 235, 0.35) 1px, transparent 1px);
  background-size: 24px 24px;
}
.container {
  width: 88%;
  max-width: 600px;
  margin: 30px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 30px 20px;
  background: #dfd0f5;
  border-radius: 20px;
  border: 3px dotted #b99bdd;
  box-sizing: border-box;
}
header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: bold;
  color: #665078;
}
/* 説明 */
.content {
  margin-top: 22px;
  padding: 25px;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 16px;
  text-align: center;
  line-height: 1.9;
  box-sizing: border-box;
}
/* 大好きボタン */
.like-area {
  margin-top: 25px;
  text-align: center;
}
.like-button {
  padding: 15px 30px;
  border: 2px solid #b99bdd;
  border-radius: 12px;
  background: #dfd0f5;
  color: #5b506b;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.like-button:hover {
  background: #d4c0ee;
}
.count {
  margin-top: 15px;
  font-size: 14px;
}
/* 戻るボタン */
.back {
  display: block;
  margin-top: 25px;
  padding: 15px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>大好きボタン</h1>
</header>
<div class="content">
  <p>
    ここに好きなことについての文章を書きます。
  </p>
  <p>
    同じ気持ちの人は、ボタンを押してください。
  </p>
</div>
<div class="like-area">
  <button class="like-button" id="likeButton">
    大好き！
  </button>
  <div class="count">
    現在 0 人と同じ気持ちです
  </div>
</div>

トップへ戻る

</div>
</body>
</html>
