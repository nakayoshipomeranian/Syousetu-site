<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仲良しポメラニアン</title>
<style>
body {
  margin: 0;
  background: #fff7f4;
  color: #5f4b4b;
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
}
/* 全体 */
.container {
  width: 90%;
  max-width: 700px;
  margin: 40px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 45px 20px;
  background: #ffe3e8;
  border-radius: 25px;
  border: 3px dotted #e8a9b5;
}
header h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 5px;
}
header p {
  margin-top: 15px;
  font-size: 14px;
}
/* メニュー */
.menu {
  margin-top: 30px;
  display: grid;
  gap: 15px;
}
.menu a {
  display: block;
  padding: 18px;
  text-align: center;
  text-decoration: none;
  color: #5f4b4b;
  background: #fff;
  border: 2px solid #f0c5cc;
  border-radius: 15px;
  transition: 0.2s;
}
.menu a:hover {
  transform: translateY(-3px);
  background: #fff0f3;
}
/* メッセージ */
.message {
  margin-top: 30px;
  padding: 25px;
  background: #fff;
  border-radius: 20px;
  text-align: center;
  line-height: 1.8;
}
/* フッター */
footer {
  margin-top: 35px;
  text-align: center;
  font-size: 12px;
  color: #a88d8d;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>ひみつの部屋</h1>
  <p>ここだけの小さな場所 ♡</p>
</header>
<div class="message">
  ようこそ。<br>
  ゆっくりしていってね。
</div>
<div class="menu">

🖼️ イラスト

📖 小説

⭐ ABOUT

</div>
<footer>
  welcome to my little room ♡
</footer>
</div>
</body>
</html>
