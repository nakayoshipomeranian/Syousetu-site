<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rmsm</title>
<style>
body {
  margin: 0;
  background: #eee5ff;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
/* 全体 */
.container {
  width: 88%;
  max-width: 600px;
  margin: 30px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 40px 20px;
  background: #ffd9e3;
  border-radius: 20px;
  border: 3px dotted #e8a9b5;
  box-sizing: border-box;
}
header h1 {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 40px;
  font-weight: bold;
  letter-spacing: 5px;
  color: #665078;
}
/* 更新情報 */
.update {
  margin-top: 22px;
  padding: 20px;
  background: #fff;
  border-radius: 16px;
  border: 2px solid #d4c0ee;
}
.update-title {
  margin: 0 0 12px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 1px;
}
.update p {
  margin: 7px 0;
  font-size: 13px;
  line-height: 1.7;
}
/* メニュー */
.menu {
  margin-top: 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.menu a {
  display: block;
  width: 100%;
  padding: 17px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
  font-weight: bold;
  box-sizing: border-box;
  transition: 0.2s;
}
.menu a:hover {
  background: #f7f1ff;
  transform: translateY(-2px);
}
/* フッター */
footer {
  margin-top: 30px;
  padding-bottom: 25px;
  text-align: center;
  font-size: 12px;
  color: #9885ad;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>rmsm</h1>
</header>
<div class="update">
  <p class="update-title">更新情報</p>
  <p>○月○日　サイトを開設しました。</p>
  <p>○月○日　小説を更新しました。</p>
</div>
<div class="menu">

先に読んで欲しいこと

自己紹介

大好きボタン

小説

イラスト

川柳のコーナー

</div>
<footer>
  rmsm
</footer>
</div>
</body>
</html>
