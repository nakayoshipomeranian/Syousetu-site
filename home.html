<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rmsm</title>
<style>
body {
  margin: 0;
  background: #eee5ff;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
/* 全体 */
.container {
  width: 90%;
  max-width: 700px;
  margin: 40px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 45px 20px;
  background: #e3d2ff;
  border-radius: 25px;
  border: 3px dotted #b99bdd;
  box-sizing: border-box;
}
header h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 42px;
  letter-spacing: 7px;
  color: #665078;
}
header p {
  margin: 15px 0 0;
  font-size: 13px;
}
/* 注意事項 */
.notice {
  margin-top: 25px;
  padding: 20px;
  background: #faf7ff;
  border: 2px solid #d4c0ee;
  border-radius: 18px;
  text-align: center;
}
.notice a {
  color: #665078;
  text-decoration: none;
  font-weight: bold;
}
/* 更新情報 */
.update {
  margin-top: 25px;
  padding: 22px;
  background: #fff;
  border-radius: 18px;
  border: 2px solid #d4c0ee;
}
.update-title {
  margin: 0 0 12px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 2px;
}
.update p {
  margin: 8px 0;
  font-size: 13px;
  line-height: 1.7;
}
/* メニュー */
.menu {
  margin-top: 30px;
  display: grid;
  gap: 15px;
}
.menu a {
  display: block;
  padding: 18px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  transition: 0.2s;
  box-sizing: border-box;
}
.menu a:hover {
  transform: translateY(-3px);
  background: #f7f1ff;
}
/* フッター */
footer {
  margin-top: 35px;
  padding-bottom: 30px;
  text-align: center;
  font-size: 12px;
  color: #9885ad;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>rmsm</h1>
</header>
<div class="notice">
  <a href="#">♡ 注意事項 ♡</a>
</div>
<div class="update">
  <p class="update-title">✦ 更新情報 ✦</p>
  <p>○月○日　サイトを開設しました。</p>
  <p>○月○日　小説を更新しました。</p>
</div>
<div class="menu">

自己紹介

♡ 大好きボタン ♡

小説

イラスト

川柳のコーナー

</div>
<footer>
  rmsm
</footer>
</div>
</body>
</html>
