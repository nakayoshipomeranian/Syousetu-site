<style>
/* 全体 */
body {

.container {
  width: 88%;

  margin: 30px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 40px 20px;
  background: #dfd0f5;
  border-radius: 20px;
  border: 3px dotted #b99bdd;
  box-sizing: border-box;

  margin: 0;

}

.update {
  margin-top: 22px;
  padding: 20px;
  background: #fff;
  border-radius: 16px;
  border: 2px solid #d4c0ee;
}
.update-title {
  margin: 0 0 12px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 1px;
}
.update p {
  margin: 7px 0;
  font-size: 13px;
  line-height: 1.7;
}
/* 項目 */
.menu {
  margin-top: 25px;
  /* 必ず縦一列 */
  display: flex;
  flex-direction: column;
  gap: 12px;
}
/* 各項目 */
.menu a {
  display: block;
  width: 100%;
  padding: 17px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
  font-weight: bold;
  box-sizing: border-box;
}
.menu a:hover {
  background: #f7f1ff;
}
/* フッター */
footer {
  margin-top: 30px;
  padding-bottom: 25px;
  text-align: center;
  font-size: 12px;
  color: #9885ad;
}
</style>
</head>
