<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己紹介 | rmsm</title>
<style>
body {
  margin: 0;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background-color: #eee5ff;
  background-image:
    linear-gradient(rgba(203, 180, 235, 0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(203, 180, 235, 0.35) 1px, transparent 1px);
  background-size: 24px 24px;
}
.container {
  width: 88%;
  max-width: 600px;
  margin: 30px auto;
}
/* タイトル */
header {
  text-align: center;
  padding: 30px 20px;
  background: #dfd0f5;
  border-radius: 20px;
  border: 3px dotted #b99bdd;
  box-sizing: border-box;
}
header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: bold;
  color: #665078;
}
/* 自己紹介 */
.profile {
  margin-top: 22px;
  padding: 25px;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 16px;
  box-sizing: border-box;
}
.profile-row {
  padding: 15px 0;
  border-bottom: 1px dashed #d4c0ee;
  line-height: 1.8;
}
.profile-row:first-child {
  padding-top: 0;
}
.profile-row:last-child {
  padding-bottom: 0;
  border-bottom: none;
}
.profile-title {
  margin-bottom: 5px;
  font-weight: bold;
  color: #765f8b;
}
/* 自由記入欄 */
.message {
  margin-top: 22px;
  padding: 25px;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 16px;
  line-height: 1.9;
}
/* 戻るボタン */
.back {
  display: block;
  margin-top: 20px;
  padding: 15px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>自己紹介</h1>
</header>
<div class="profile">
  <div class="profile-row">
    <div class="profile-title">名前</div>
    ここに名前を書きます。
  </div>
  <div class="profile-row">
    <div class="profile-title">好きなもの</div>
    ここに好きなものを書きます。
  </div>
  <div class="profile-row">
    <div class="profile-title">好きな作品</div>
    ここに好きな作品を書きます。
  </div>
  <div class="profile-row">
    <div class="profile-title">ひとこと</div>
    ここにひとことを書きます。
  </div>
</div>
<div class="message">

ここに自由に自己紹介を書きます。

</div>

トップへ戻る

</div>
</body>
</html>
