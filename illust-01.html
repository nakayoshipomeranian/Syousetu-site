<title>イラスト集その1 | rmsm</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background-color: #eee5ff;
  background-image:
    linear-gradient(rgba(203, 180, 235, 0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(203, 180, 235, 0.35) 1px, transparent 1px);
  background-size: 24px 24px;
}

.container {
  width: 90%;
  max-width: 600px;
  margin: 30px auto;
}

header {
  text-align: center;
  padding: 28px 16px;
  background: #dfd0f5;
  border-radius: 20px;
  border: 3px dotted #b99bdd;
}

header h1 {
  margin: 0;
  font-size: 24px;
  color: #665078;
}

header p {
  margin: 8px 0 0;
  font-size: 12px;
  color: #7b6b89;
}

/* サムネイル一覧 */
.gallery {
  margin-top: 22px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.illust {
  min-width: 0;
  padding: 8px;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.2s;
}

.illust:active {
  transform: scale(0.97);
}

.illust img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 8px;
}

.caption {
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
  color: #7b6b89;
  overflow-wrap: anywhere;
}

/* 拡大表示 */
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 20px;
  background: rgba(43, 32, 55, 0.88);
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.viewer.open {
  display: flex;
}

.viewer img {
  display: block;
  max-width: 100%;
  max-height: 78vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 0 0 5px #dfd0f5;
}

.viewer-caption {
  margin-top: 16px;
  color: #fff;
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
}

.close {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 42px;
  height: 42px;
  border: 2px solid #dfd0f5;
  border-radius: 50%;
  background: #fff;
  color: #665078;
  font-size: 26px;
  cursor: pointer;
}

.back {
  display: block;
  margin-top: 20px;
  padding: 14px;
  text-align: center;
  text-decoration: none;
  color: #5b506b;
  background: #fff;
  border: 2px solid #cdb5ea;
  border-radius: 14px;
}

.back + .back {
  margin-top: 10px;
}
</style>
</head>

<!-- 拡大表示用の画面 -->
<div class="viewer" id="viewer" role="dialog"
     aria-modal="true" aria-label="イラスト拡大表示">
  <button class="close" id="closeViewer"
          aria-label="閉じる">×</button>
  <img id="largeImage" src="" alt="">
  <div class="viewer-caption" id="largeCaption"></div>
</div>

<script>
const viewer = document.getElementById("viewer");
const largeImage = document.getElementById("largeImage");
const largeCaption = document.getElementById("largeCaption");
const closeViewer = document.getElementById("closeViewer");

document.querySelectorAll(".illust").forEach(card => {
  card.addEventListener("click", () => {
    const image = card.querySelector("img");

    // 画像が存在しないカードは開かない
    if (!image.complete || image.naturalWidth === 0) {
      return;
    }

    largeImage.src = image.src;
    largeImage.alt = image.alt;
    largeCaption.textContent = card.dataset.caption || "";

    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
    closeViewer.focus();
  });
});

function closeImage() {
  viewer.classList.remove("open");
  largeImage.src = "";
  document.body.style.overflow = "";
}

closeViewer.addEventListener("click", closeImage);

// 画像の外側をタップしても閉じる
viewer.addEventListener("click", event => {
  if (event.target === viewer) {
    closeImage();
  }
});

// Escキーでも閉じる
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeImage();
  }
});
</script>
