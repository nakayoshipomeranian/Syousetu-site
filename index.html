<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仲ポメ（rmsm）</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #eee5ff;
  background-image:
    linear-gradient(rgba(203, 180, 235, 0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(203, 180, 235, 0.35) 1px, transparent 1px);
  background-size: 24px 24px;
  color: #5b506b;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
/* 中央のボックス */
.box {
  width: 88%;
  max-width: 420px;
  padding: 35px 25px;
  box-sizing: border-box;
  text-align: center;
  background: #faf7ff;
  border: 2px solid #cdb5ea;
  border-radius: 22px;
}
/* タイトル */
h1 {
  margin: 0;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #665078;
}
/* 年齢について */
.age {
  margin-top: 12px;
  font-size: 13px;
  color: #665078;
}
/* 質問 */
.question {
  margin-top: 28px;
  font-size: 15px;
  line-height: 1.8;
}
.question .answer {
  font-weight: bold;
}
/* 入力欄 */
input {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  box-sizing: border-box;
  border: 2px solid #cdb5ea;
  border-radius: 10px;
  background: #fff;
  color: #5b506b;
  font-size: 16px;
  outline: none;
}
input:focus {
  border-color: #a98bc9;
}
/* 入るボタン */
button {
  margin-top: 15px;
  padding: 12px 35px;
  border: 2px solid #b99bdd;
  border-radius: 10px;
  background: #dfd0f5;
  color: #5b506b;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #d4c0ee;
}
/* エラー */
#error {
  margin-top: 12px;
  color: #8b6b9d;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="box">
  <h1>仲ポメ（rmsm）</h1>
  <div class="age">
    18歳未満は入らないで下さい
  </div>
  <div class="question">
    どうするか返事をして下さい<br>
    <span class="answer">「明日だ」</span>
  </div>

<input
type=“text”
id=“password”
placeholder=“パスワード”
autocomplete=“off”

  <br>

入る

  <p id="error"></p>
</div>
<script>
function login() {
  const password = document.getElementById("password").value;
  if (password === "ここにパスワード") {
    window.location.href = "home.html";
  } else {
    document.getElementById("error").textContent =
      "パスワードが違います";
  }
}
</script>
</body>
</html>
